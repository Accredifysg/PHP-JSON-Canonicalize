name: Conformance Report

# Publishes the RFC 8785 conformance report to
# jcs.ietf.reports.conformance.accredify.dev.
#
# On a release, because the report asserts a version and a report whose
# version no longer exists is worse than none. Weekly as well, because the
# cyberphone suite is a submodule pointing at a repository we do not control:
# a vector added upstream can turn a complete report into one that
# under-claims coverage without anything here changing.
#
# Unlike the sibling libraries, there is nothing to submit this to — IETF
# publishes no suite and keeps no implementation registry. So this site is not
# a staging post for a pull request; it is the only published form the result
# has, which is also why both it and the report say "self-reported" on their
# face.

on:
  release:
    types: [released]
  schedule:
    - cron: "0 4 * * 1" # Mon 04:00 UTC, after the index rebuilds
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    name: Build and publish the conformance report
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # fetch-depth 0 for git describe, and the submodule because the
      # cyberphone vectors are what the suite runs and the report pins.
      - name: Checkout (with conformance submodule)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: hash, mbstring
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # The suite must pass for the report to mean anything, but a failing
      # case is not a reason to publish nothing: the report records each case
      # with its own outcome, and an honest report of a partial pass is more
      # use than silence. So the run is allowed to fail and the report is
      # generated either way — the generator still refuses if the log and the
      # suite disagree about what ran.
      - name: Run the RFC 8785 conformance suite
        run: vendor/bin/pest --testsuite=Conformance --log-junit conformance-junit.xml
        continue-on-error: true

      - name: Resolve the version
        id: version
        run: echo "value=$(git describe --tags --abbrev=0 2>/dev/null || echo dev)" >> "$GITHUB_OUTPUT"

      - name: Generate the conformance report
        run: |
          php scripts/generate-conformance-report.php \
            conformance-junit.xml "${{ steps.version.outputs.value }}" \
            > php-json-canonicalize-conformance.json

      - name: Build the site
        run: scripts/build-report-site.sh php-json-canonicalize-conformance.json "${{ steps.version.outputs.value }}"

      - name: Keep the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-report
          path: php-json-canonicalize-conformance.json
          if-no-files-found: error

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
